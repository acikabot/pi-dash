[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "var", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["pidash"]   # var/ belongs to the service account, so don't walk into it
python_files = ["test_*.py"]
addopts = "-q"
