{% extends "core/base.html" %}
{% block content %}
<form class="row g-2 align-items-end mb-3" method="get" action="{% url 'logs:page' %}">
  <div class="col-6 col-lg-3">
    <label class="form-label" for="service">Service</label>
    <select class="form-select" name="service" id="service" data-autosubmit>
      {% for option in services %}
      <option value="{{ option.id }}" {% if option.id == service.id %}selected{% endif %}>{{ option.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 col-lg-2">
    <label class="form-label" for="lines">Lines</label>
    <select class="form-select" name="lines" id="lines" data-autosubmit>
      {% for choice in line_choices %}
      <option value="{{ choice }}" {% if choice == lines %}selected{% endif %}>{{ choice }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12 col-lg-4">
    <label class="form-label" for="find">Filter</label>
    <input type="search" class="form-control" name="find" id="find" value="{{ find }}"
           placeholder="Only lines containing…">
  </div>
  <div class="col-12 col-lg-3 d-flex gap-2">
    <button class="btn btn-outline-secondary btn-touch" type="submit"><i class="bi bi-funnel"></i> Apply</button>
    <div class="form-check align-self-center mb-0">
      <input class="form-check-input" type="checkbox" name="auto" value="1" id="auto"
             {% if auto %}checked{% endif %} data-autosubmit>
      <label class="form-check-label" for="auto">Auto-refresh</label>
    </div>
  </div>
</form>

<div class="d-flex flex-wrap align-items-center gap-2 mb-2 small text-body-secondary">
  <span><i class="bi bi-hdd"></i> {{ service.log_path }} ({{ size }})</span>
  <form class="ms-auto" method="post" action="{% url 'logs:clear' service.id %}"
        data-confirm="Empty this log file?">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-eraser"></i> Clear log</button>
  </form>
</div>

<div {% if auto %}hx-get="{% url 'logs:console' %}?service={{ service.id }}&lines={{ lines }}&find={{ find|urlencode }}"
     hx-trigger="every 5s" hx-swap="innerHTML"{% endif %}>
  {% include "logs/_console.html" %}
</div>
{% endblock %}
